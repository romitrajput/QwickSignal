name: Global News Intelligence pipeline

on:
  schedule:
    # Every 5 minutes: fetch new posts from the Telegram channels, and pick up any channel
    # just added or removed via Link Pages. 5 minutes is the fastest schedule GitHub Actions
    # will actually run - a shorter interval (e.g. */1) is silently ignored/throttled by
    # GitHub itself, so this is as close to "1 minute" as a scheduled workflow can get. Actual
    # runs can also lag a few minutes behind the schedule at busy times (GitHub's own
    # best-effort scheduling, not something this file controls).
    - cron: "*/5 * * * *"
   # - cron: "30 1 * * *"    # 07:00 India time: fetch, then write the daily briefing (needs ANTHROPIC_API_KEY)
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: all
        options: [check, fetch, briefing, all, videos, images]

permissions:
  contents: write

concurrency:
  group: gni-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Image OCR (image_ocr.py): reads text printed on image-only Telegram posts (a screenshot or
      # infographic with no caption). pytesseract (in requirements.txt) is just a Python wrapper - the
      # actual OCR engine and its language data have to be installed on the runner itself. eng + hin
      # covers the channels configured by default; add more tesseract-ocr-<lang> packages here if you
      # add channels that post in other scripts. Never fails the run: image_ocr.py skips OCR cleanly
      # if this step doesn't run or the packages aren't present.
      - name: Install tesseract OCR
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-hin

      # Node.js lets the video step read stories with the very same rules the app uses (app.js)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_SEARCH_CX: ${{ secrets.GOOGLE_SEARCH_CX }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "30 1 * * *" ]; then MODE=all; else MODE=fetch; fi
          fi
          echo "Mode: $MODE"
          python pipeline.py "$MODE"

      - name: Save results
        run: |
          git config user.name "gni-bot"
          git config user.email "gni-bot@users.noreply.github.com"
          for f in feed.json briefing.json state.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then
            echo "Nothing to save"
          else
            git commit -m "Update feed"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi

      # Phase 2.5: the stories above are already published. Now look for a verified news video for the important ones.
      # This step can be slow, fail or run out of API quota without ever affecting the news (continue-on-error).
      - name: Discover videos
        if: ${{ !contains(fromJSON('["check","briefing","videos"]'), inputs.mode) }}
        continue-on-error: true
        timeout-minutes: 8
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python pipeline.py videos

      - name: Save videos
        if: ${{ !contains(fromJSON('["check","briefing","videos"]'), inputs.mode) }}
        run: |
          git config user.name "gni-bot"
          git config user.email "gni-bot@users.noreply.github.com"
          for f in feed.json state.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then
            echo "No new videos to save"
          else
            git commit -m "Update videos"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi

      # Headline images: same idea as the video step above, just for a real news photo per story.
      # Google's Custom Search free tier is only 100 queries/day (image_intel.py's Budget enforces
      # this), so this can never affect the news feed either way (continue-on-error).
      - name: Discover images
        if: ${{ !contains(fromJSON('["check","briefing","videos","images"]'), inputs.mode) }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_SEARCH_CX: ${{ secrets.GOOGLE_SEARCH_CX }}
        run: python pipeline.py images

      - name: Save images
        if: ${{ !contains(fromJSON('["check","briefing","videos","images"]'), inputs.mode) }}
        run: |
          git config user.name "gni-bot"
          git config user.email "gni-bot@users.noreply.github.com"
          for f in feed.json state.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then
            echo "No new images to save"
          else
            git commit -m "Update images"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi

      # A manual "images" dispatch already ran python pipeline.py images inside "Run pipeline" above,
      # and "Save results" already commits feed.json/state.json for every mode - nothing further needed here.
